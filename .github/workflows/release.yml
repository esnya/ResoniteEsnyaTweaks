name: Build and Release EsnyaTweaks

on:
  push:
    branches:
      - master
      - feature/ci
      - ci
      - ci/*
    tags:
      - v*
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Fetch Resonite shim assemblies (RML/Harmony/HotReload)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p Resonite
          echo "Downloading ResoniteModLoader + 0Harmony..."
          # Try to download a release asset that contains RML and 0Harmony
          gh release download -R resonite-modding-group/ResoniteModLoader --pattern "RML*.zip" --dir Resonite --clobber || true
          gh release download -R resonite-modding-group/ResoniteModLoader --pattern "ResoniteModLoader*.zip" --dir Resonite --clobber || true
          if compgen -G "Resonite/*.zip" > /dev/null; then
            unzip -o Resonite/*.zip -d Resonite >/dev/null
          fi
          # In case assets were separate DLLs in the release, attempt direct download patterns as well
          gh release download -R resonite-modding-group/ResoniteModLoader --pattern "ResoniteModLoader.dll" --dir Resonite --clobber || true
          gh release download -R resonite-modding-group/ResoniteModLoader --pattern "0Harmony.dll" --dir Resonite --clobber || true

          echo "Downloading HotReload libs..."
          gh release download -R Nytra/ResoniteHotReloadLib --pattern "HotReloadLib.*.RML.zip" --dir Resonite --clobber
          unzip -o Resonite/HotReloadLib.*.RML.zip -d Resonite >/dev/null

          echo "Listing Resonite/ contents"
          ls -la Resonite || true

      - name: Restore with explicit ResonitePath
        run: |
          dotnet restore -v:minimal --locked-mode -p:ResonitePath="${{ github.workspace }}/Resonite/"
          dotnet restore Common.PureTests/Common.PureTests.csproj -v:minimal --locked-mode -p:ResonitePath="${{ github.workspace }}/Resonite/"

      - name: Verify Resonite.GameLibs is referenced
        run: |
          echo "Listing packages for FluxLoopTweaks (transitive included)"
          dotnet list FluxLoopTweaks/FluxLoopTweaks.csproj package --include-transitive | tee packages.txt
          echo "Check Resonite.GameLibs presence"
          grep -i "Resonite.GameLibs" packages.txt || (echo "Resonite.GameLibs not found in package list" && exit 1)

      - name: .NET format
        run: |
          dotnet format --verify-no-changes --no-restore

      - name: Build solution
        run: |
          dotnet build -c ${{ matrix.configuration }} -v:minimal -warnaserror --no-restore -bl:build-${{ matrix.configuration }}.binlog -p:ResonitePath="${{ github.workspace }}/Resonite/"

      - name: Test (Pure tests only)
        run: |
          dotnet test Common.PureTests/Common.PureTests.csproj -c ${{ matrix.configuration }} -v:minimal -warnaserror --no-restore -p:ResonitePath="${{ github.workspace }}/Resonite/" --logger "trx;LogFileName=test-results-${{ matrix.configuration }}.trx"


      - name: Collect artifacts (EsnyaTweaks.* only, excluding tests)
        if: matrix.configuration == 'Release'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find . -type f -path "*/bin/Release/*" -name "EsnyaTweaks.*.dll" \
            | grep -v -E "(\\.Tests|/Tests/|/Shared.Tests/|/obj/|/ref/)" \
            | xargs -I{} cp -v "{}" artifacts/

      - name: Upload build artifacts
        if: matrix.configuration == 'Release' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: dll-artifacts
          path: artifacts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -o '<Version>[^<]*</Version>' Directory.Build.props | sed -e 's/<Version>//' -e 's/<\/Version>//')
          test "v${version}" = "${{ github.ref_name }}"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dll-artifacts
          path: artifacts

      - name: Debug downloaded files
        run: |
          echo "=== Downloaded files ==="
          ls -la
          echo "=== Looking for DLL files ==="
          find . -name "*.dll" -type f || echo "No DLL files found"
          echo "=== End debug ==="

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dll
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
